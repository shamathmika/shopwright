apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: shopwright-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          env:
            - {name: AGENT_URL, value: "http://agent:8000"}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
