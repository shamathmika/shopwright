apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
spec:
  replicas: 1
  selector:
    matchLabels: {app: retrieval}
  template:
    metadata:
      labels: {app: retrieval}
    spec:
      containers:
        - name: retrieval
          image: shopwright-retrieval:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: llm}
            - secretRef: {name: llm}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval
spec:
  selector: {app: retrieval}
  ports: [{port: 8000, targetPort: 8000}]
